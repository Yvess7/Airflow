name: airflow-ventas

services:
  airflow-init:
    image: apache/airflow:3.3.2-python3.12
    user: "0:0"
    entrypoint: /bin/bash
    command: ["-c", "chown ${AIRFLOW_UID:-50000}:0 /opt/airflow/runtime"]
    volumes:
      - airflow-runtime:/opt/airflow/runtime

  airflow:
    image: apache/airflow:3.3.2-python3.12
    user: "${AIRFLOW_UID:-50000}:0"
    init: true
    command: standalone
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: alumno:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/runtime/passwords.json
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/runtime/airflow.db
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/runtime/logs
      VENTAS_INPUT_PATH: /opt/airflow/data/ventas.csv
      VENTAS_OUTPUT_DIR: /opt/airflow/output
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./data:/opt/airflow/data:ro
      - ./output:/opt/airflow/output
      - airflow-runtime:/opt/airflow/runtime
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  airflow-runtime:
